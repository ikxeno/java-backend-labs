spring.application.name=lab-3
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/java_backend_labs}
spring.datasource.username=${DB_USER:labs}
spring.datasource.password=${DB_PASSWORD:labs}
spring.datasource.hikari.schema=${DB_SCHEMA:lab3}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=5000
spring.flyway.default-schema=${DB_SCHEMA:lab3}
spring.flyway.schemas=${DB_SCHEMA:lab3}
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.accept-float-as-int=false
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}

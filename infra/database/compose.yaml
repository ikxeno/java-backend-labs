name: java-backend-labs

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-java_backend_labs}
      POSTGRES_USER: ${DB_USER:-labs}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-labs}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
